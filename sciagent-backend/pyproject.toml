[project]
name = "sciagent-backend"
version = "0.1.0"
description = "SciAgent backend services (KG Service first) -- see specs/"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "minio>=7.2.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    # kg-worker's optional run_extraction follow-up imports sciagent-KG's
    # src.extraction.* modules directly (see kg_service/jobs.py) -- these
    # three are sciagent-KG dependencies this process now needs too.
    "spacy>=3.8.14",
    "openai>=2.53.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
]
