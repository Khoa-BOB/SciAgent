services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    environment:
      NEO4J_AUTH: neo4j/myStrongPassword123
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import: